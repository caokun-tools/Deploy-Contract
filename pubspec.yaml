name: deploy_contract
description: "一键部署智能合约 - Deploy Smart Contracts to Ethereum & BSC"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Web3 & Cryptography
  web3dart: ^2.7.3
  bip39: ^1.0.6
  bip32: ^2.0.0
  hex: ^0.2.0
  convert: ^3.1.1
  pointycastle: ^3.9.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # File Operations
  file_picker: ^8.0.7
  share_plus: ^10.0.0

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1

  # Network
  http: ^1.2.1

  # Utilities
  qr_flutter: ^4.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
